<!DOCTYPE html>
<html lang="en">
  <head>
    <title>StochasticLatticeGen</title>
    <meta charset="utf-8"/>
    <meta name="application-name" content="StochasticLatticeGen">
    <meta name="description" content="Mesh-bounded stochastic lattice generation in the browser">
    <meta name="keywords" content="Voronoi, Lattice, Manifold, three.js">
    <meta name="author" content="Johnathon Selstad">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=0">
    <meta name="theme-color" content="#afb6c8">
    <style>
      body { margin: 0; overflow: hidden; background: #afb6c8; font-family: system-ui, sans-serif; }
      #appbody { position: absolute; inset: 0; }
      #info {
        position: absolute; top: 0; left: 0; right: 0; margin: 0 auto; width: 24em; padding: 10px;
        box-sizing: border-box; text-align: center; color: white; background: #888a; border-radius: 0 0 24px 24px;
        pointer-events: none; font-size: 14px;
      }
      #status { margin-top: 4px; min-height: 1.2em; }
      #status progress { display: block; width: 100%; margin-top: 2px; }
      #errors div { color: #ffb0b0; word-break: break-word; }
    </style>
    <!-- Import map: lets the demo run straight from source. `npm run build` bundles it instead. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/",
          "three-mesh-bvh": "./node_modules/three-mesh-bvh/build/index.module.js",
          "manifold-3d": "./node_modules/manifold-3d/manifold.js",
          "voro3d": "./node_modules/voro3d/dist/index.js",
          "es-module-shims": "./node_modules/es-module-shims/dist/es-module-shims.wasm.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="appbody"></div>
    <div id="info">
      <b>Stochastic Lattice Generation</b><br/>
      Drag &amp; drop a mesh (OBJ, STL, GLB, FBX, USDZ) to load it
      <div id="status"></div>
      <div id="errors"></div>
    </div>
    <script type="module" src="./src/demo/main.js"></script>
  </body>
</html>
